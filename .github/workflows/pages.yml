name: Deploy to GitHub Pages

# Builds the static ws4kp site (gulp -> dist/) and publishes it to GitHub Pages.
# Fork customization for the Tempest "Home" station (Statham, GA).

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh live Tempest data on a schedule. ~10 min keeps us comfortably under GitHub
  # Pages' deploy rate limits while staying fresh enough for a retro current-conditions screen.
  schedule:
    - cron: '*/10 * * * *'

# Least-privilege token plus the OIDC/pages perms the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish token-free Tempest snapshot
        env:
          TEMPEST_TOKEN: ${{ secrets.TEMPEST_TOKEN }}
        run: |
          if [ -z "${TEMPEST_TOKEN}" ]; then
            echo "::notice::TEMPEST_TOKEN not set — deploying without live data (NOAA only). Add the secret to enable."
            exit 0
          fi
          if node tools/fetch-tempest.mjs > dist/tempest-current.json; then
            echo "Published dist/tempest-current.json ($(wc -c < dist/tempest-current.json) bytes)"
          else
            echo "::warning::Tempest fetch failed this cycle — deploying without live data."
            rm -f dist/tempest-current.json
          fi
          if node tools/fetch-forecast.mjs > dist/tempest-forecast.json; then
            echo "Published dist/tempest-forecast.json ($(wc -c < dist/tempest-forecast.json) bytes)"
          else
            echo "::warning::Tempest forecast fetch failed this cycle — forecast screens stay NOAA."
            rm -f dist/tempest-forecast.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
